name: Build ROM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Apply overlay
        run: |
          if [ -f overlay.zip ]; then unzip -o overlay.zip; fi

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y binutils-arm-none-eabi libpng-dev

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: ./agbcc

      - name: Build FireRed rev1
        run: make firered_rev1 COMPARE=0 -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: rom
          path: |
            *.gba
